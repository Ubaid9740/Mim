[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mim"
version = "1.0.0"
description = "Local-First Temporal Desktop Memory Substrate & MCP Server for AI Coding Agents"
requires-python = ">=3.11"
dependencies = [
    "lancedb>=0.15.0",
    "pyarrow>=17.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "mss>=9.0.1",
    "Pillow>=10.4.0",
    "uiautomation>=2.0.20",
    "psutil>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "fastembed>=0.3.6",
    "google-genai>=0.3.0",
    "PyQt6>=6.7.0",
    "pynput>=1.7.7",
    "python-dotenv>=1.0.1",
    "mcp>=1.2.0",
]

[project.scripts]
mim-daemon = "main:main"
mim-mcp = "mim_mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mim*"]